version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: store-app-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: store-app
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
